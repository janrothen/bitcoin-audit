[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitcoin-audit"
version = "0.1.0"
description = "Daily X bot that posts Bitcoin block height and circulating supply via cron on a Raspberry Pi."
requires-python = ">=3.13"
dependencies = [
    "python-dotenv~=1.2.4",
    "requests~=2.34",
    "tweepy~=4.17",
    # Security floors for transitive deps (via requests). Without
    # these, `pip install .` keeps an already-installed vulnerable version.
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2 (distrusted emSign root)
    "idna>=3.15",           # GHSA-65pc-fj4g-8rjx (CVE-2026-45409)
    "urllib3>=2.8.0",       # GHSA-qccp-gfcp-xxvc, GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77, ...
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "pytest-cov~=7.1",
    "pre-commit~=4.7",
    "ruff~=0.17.6",
    # Security floors for transitive deps of pre-commit.
    "virtualenv>=21.14.10",  # GHSA-6w3r-xr62-4xcp, GHSA-4f8h-vr72-p32c, ...
    "filelock>=4.2.1",       # GHSA-69hj-f68j-2879, GHSA-j8f7-rjxc-mr56, ...
]

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/audit --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
